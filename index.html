<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogo Auto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F3F0; --surface:#FFFFFF; --ink:#16181D; --ink2:#2A2D33; --muted:#5B5F68;
    --line:#E2E0DA; --line2:#D4D2CB; --accent:#C2410C; --accent-dark:#9A3412; --accent-soft:#FDE9DD;
    --chip:#F1EFEA; --seg:#E7E5DF;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;font-size:16px}
  button,input{font:inherit}
  .wrap{max-width:1360px;margin:0 auto;padding:32px 24px 48px;display:flex;flex-direction:column;gap:24px}
  .display{font-family:'Barlow Condensed',sans-serif}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
  .eyebrow{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
  h1{margin:2px 0 0;font-weight:700;font-size:44px;line-height:1}
  .btn-dark{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:600;cursor:pointer}

  nav{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
  .tab{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 18px;border:0;background:transparent;font-size:17px;cursor:pointer;margin-bottom:-1px;color:var(--muted);font-weight:500;border-bottom:3px solid transparent}
  .tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
  .count{min-width:22px;padding:1px 7px;border-radius:999px;font-size:13px;font-weight:600;text-align:center;background:var(--seg);color:#3A3D44}
  .tab[aria-selected="true"] .count{background:var(--accent-soft);color:var(--accent-dark)}

  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
  .search{position:relative;flex:1 1 280px;max-width:420px}
  .search svg{position:absolute;left:14px;top:13px}
  .search input{width:100%;min-height:44px;padding:0 14px 0 42px;border:1px solid var(--line2);border-radius:10px;background:#fff;color:var(--ink)}
  .search input::placeholder{color:#6B6F78}
  .group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .label{font-size:14px;color:var(--muted)}
  .chip{min-height:36px;padding:0 14px;border-radius:999px;font-size:14px;cursor:pointer;background:#fff;color:var(--ink2);border:1px solid var(--line2);font-weight:500}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
  .sort{margin-left:auto}
  .seg{display:flex;padding:3px;border-radius:10px;background:var(--seg);gap:2px}
  .seg button{min-height:38px;padding:0 12px;border:0;border-radius:8px;font-size:14px;cursor:pointer;background:transparent;color:#3A3D44;font-weight:500}
  .seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}

  .main{display:flex;flex-wrap:wrap;align-items:flex-start;gap:24px}
  .list{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
  .empty{padding:48px 24px;border:1px dashed #C9C6BE;border-radius:12px;text-align:center;color:var(--muted)}

  .card{display:flex;flex-direction:column;padding:0;background:#fff;border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .card[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
  .card:focus-visible,.chip:focus-visible,.tab:focus-visible,.seg button:focus-visible,.thumb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .photo{position:relative;height:170px;display:flex;align-items:center;justify-content:center;color:#3A3D44;overflow:hidden;width:100%}
  .photo img,.big img,.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .ph{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:500}
  .badge{position:absolute;right:10px;bottom:10px;padding:3px 8px;border-radius:999px;background:rgba(22,24,29,.78);color:#fff;font-size:12px;font-weight:600}
  .card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;width:100%}
  .card-title{font-size:23px;font-weight:600;line-height:1.1;color:var(--ink)}
  .sub{font-size:14px;color:var(--muted)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tags span{padding:3px 9px;border-radius:6px;background:var(--chip);font-size:13px;color:#3A3D44}

  aside{flex:1 1 360px;min-width:0;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .big{position:relative;height:280px;display:flex;align-items:center;justify-content:center;color:#3A3D44;overflow:hidden}
  .big .ph{gap:8px;font-size:13px}
  .big .ph strong{font-size:15px}
  .big .pill{position:absolute;left:10px;top:10px;padding:3px 9px;border-radius:999px;background:rgba(22,24,29,.78);color:#fff;font-size:12px;font-weight:600}
  .credit{margin:0;padding:8px 16px 0;font-size:12px;line-height:1.4;color:var(--muted)}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 0}
  .thumb{position:relative;overflow:hidden;padding:0;width:56px;height:44px;border-radius:8px;color:#3A3D44;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--line2)}
  .thumb[aria-pressed="true"]{border:2px solid var(--accent)}
  .thumb.add{border:1px dashed #B8B5AC;background:#fff;color:var(--muted);display:flex;align-items:center;justify-content:center}
  .detail{padding:20px 20px 24px;display:flex;flex-direction:column;gap:16px}
  h2{margin:4px 0 0;font-size:34px;font-weight:700;line-height:1.05}
  dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
  dt{font-size:13px;color:var(--muted)}
  dd{margin:2px 0 0;font-size:15px;font-weight:500;color:var(--ink)}
  .notes{display:flex;flex-direction:column;gap:4px;padding-top:14px;border-top:1px solid #ECEAE4}
  .notes p{margin:0;font-size:15px;line-height:1.5;color:var(--ink2)}
  .actions{display:flex;flex-wrap:wrap;gap:10px}
  .btn-accent{flex:1 1 140px;min-height:44px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
  .btn-ghost{min-height:44px;padding:0 18px;border:1px solid var(--line2);border-radius:10px;background:#fff;color:var(--ink);font-weight:500;cursor:pointer}
  @media (max-width:600px){ h1{font-size:36px} .sort{margin-left:0} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">La mia collezione</div>
      <h1 class="display">Garage di carta e metallo</h1>
    </div>
    <button type="button" class="btn-dark" id="add">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span id="addLabel"></span>
    </button>
  </header>

  <nav aria-label="Categorie" role="tablist" id="tabs"></nav>

  <div class="toolbar">
    <div class="search">
      <label for="cerca" class="sr">Cerca nella collezione</label>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B5F68" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="cerca" type="search">
    </div>
    <div class="group"><span class="label" id="filterLabel"></span><span class="group" id="chips"></span></div>
    <div class="group sort"><span class="label">Ordina per</span><div class="seg" id="sorts"></div></div>
  </div>

  <div class="main">
    <section class="list" aria-label="Elenco">
      <span class="label" id="countLabel"></span>
      <div class="empty" id="empty" hidden>Nessun risultato. Prova a cambiare ricerca o filtro.</div>
      <div class="grid" id="grid"></div>
    </section>
    <aside aria-label="Dettaglio" id="detail"></aside>
  </div>
</div>

var ORDER = ["modellini","libri","poster"];
var SORTS = [["nome","Nome A–Z"],["anno","Anno"],["aggiunto","Ultimi aggiunti"]];

var state = { tab:"modellini", q:"", filter:"Tutti", sort:"nome", sel:null, photo:0 };
function set(patch){ for (var k in patch) state[k] = patch[k]; render(); }

var $ = function(id){ return document.getElementById(id); };
$("cerca").addEventListener("input", function(e){ set({ q:e.target.value, sel:null, photo:0 }); });

function visible(){
  var cat = CATS[state.tab], q = state.q.toLowerCase().trim();
  var list = cat.items.filter(function(it){
    if (state.filter !== "Tutti" && it.key !== state.filter) return false;
    if (q && (it.name + " " + it.sub).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  list.sort(function(a,b){
    if (state.sort === "anno") return a.year - b.year;
    if (state.sort === "aggiunto") return a.added < b.added ? 1 : -1;
    return a.name.localeCompare(b.name, "it");
  });
  return list;
}

function render(){
  var cat = CATS[state.tab];
  $("addLabel").textContent = cat.add;
  $("filterLabel").textContent = cat.filterLabel;
  var input = $("cerca");
  input.placeholder = cat.search;
  if (input.value !== state.q) input.value = state.q;

  $("tabs").innerHTML = ORDER.map(function(k){
    return '<button type="button" role="tab" class="tab" data-tab="'+k+'" aria-selected="'+(k===state.tab)+'"><span>'+CATS[k].label+'</span><span class="count">'+CATS[k].items.length+'</span></button>';
  }).join("");
  $("chips").innerHTML = cat.filters.map(function(f){
    return '<button type="button" class="chip" data-filter="'+esc(f)+'" aria-pressed="'+(f===state.filter)+'">'+esc(f)+'</button>';
  }).join("");
  $("sorts").innerHTML = SORTS.map(function(s){
    return '<button type="button" data-sort="'+s[0]+'" aria-pressed="'+(s[0]===state.sort)+'">'+s[1]+'</button>';
  }).join("");

  var list = visible();
  var selId = state.sel;
  if (!list.some(function(it){ return it.id === selId; })) selId = list.length ? list[0].id : null;
  var n = list.length;
  $("countLabel").textContent = n + " " + (n === 1 ? cat.singular.toLowerCase() : cat.plural) + (n === cat.items.length ? "" : " su " + cat.items.length);
  $("empty").hidden = n !== 0;

  $("grid").innerHTML = list.map(function(it){
    var img = it.imgs && it.imgs[0];
    return '<button type="button" class="card" data-sel="'+it.id+'" aria-pressed="'+(it.id===selId)+'">' +
      '<div class="photo" style="background:'+it.tint+'">' +
        (img ? '<img src="'+img.src+'" alt="'+esc(it.name)+'">' : '<div class="ph">'+CAMERA+'<span>Foto principale</span></div>') +
        '<span class="badge">'+it.photos+' foto</span>' +
      '</div>' +
      '<div class="card-body"><span class="card-title display">'+esc(it.name)+'</span><span class="sub">'+esc(it.sub)+'</span>' +
      '<div class="tags"><span>'+cat.yearWord+' '+it.year+'</span><span>'+esc(it.tag)+'</span></div></div>' +
    '</button>';
  }).join("");

  var cur = list.filter(function(it){ return it.id === selId; })[0];
  var aside = $("detail");
  aside.hidden = !cur;
  if (!cur) { aside.innerHTML = ""; return; }
  var pi = Math.min(state.photo, cur.photos - 1);
  var bi = cur.imgs && cur.imgs[pi];
  var thumbs = "";
  for (var i = 0; i < cur.photos; i++) {
    var t = cur.imgs && cur.imgs[i];
    thumbs += '<button type="button" class="thumb" data-photo="'+i+'" aria-label="Mostra foto '+(i+1)+'" aria-pressed="'+(i===pi)+'" style="background:'+cur.tint+'">' +
      (t ? '<img src="'+t.src+'" alt="">' : (i+1)) + '</button>';
  }
  aside.innerHTML =
    '<div class="big" style="background:'+cur.tint+'">' +
      (bi ? '<img src="'+bi.src+'" alt="'+esc(cur.name)+', foto '+(pi+1)+'"><span class="pill">Foto '+(pi+1)+' di '+cur.photos+'</span>'
          : '<div class="ph">'+CAMERA.replace(/32/g,"40")+'<strong>Foto '+(pi+1)+' di '+cur.photos+'</strong><span>Segnaposto: qui va la tua foto</span></div>') +
    '</div>' +
    (bi ? '<p class="credit">'+esc(bi.credit)+'</p>' : '') +
    '<div class="thumbs">'+thumbs+'<button type="button" class="thumb add" aria-label="Aggiungi foto"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>' +
    '<div class="detail">' +
      '<div><div class="eyebrow">'+cat.singular+'</div><h2 class="display">'+esc(cur.name)+'</h2><span class="sub" style="font-size:15px">'+esc(cur.sub)+'</span></div>' +
      '<dl>' + cur.fields.map(function(f){ return '<div><dt>'+esc(f[0])+'</dt><dd>'+esc(f[1])+'</dd></div>'; }).join("") + '</dl>' +
      '<div class="notes"><span class="label" style="font-size:13px">Note</span><p>'+esc(cur.notes)+'</p></div>' +
      '<span class="label" style="font-size:13px">Aggiunto alla collezione il '+fmtDate(cur.added)+'</span>' +
      '<div class="actions"><button type="button" class="btn-accent">Modifica dettagli</button><button type="button" class="btn-ghost">Elimina</button></div>' +
    '</div>';
}

document.addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  if (b.dataset.tab) set({ tab:b.dataset.tab, filter:"Tutti", q:"", sel:null, photo:0 });
  else if (b.dataset.filter) set({ filter:b.dataset.filter, sel:null, photo:0 });
  else if (b.dataset.sort) set({ sort:b.dataset.sort });
  else if (b.dataset.sel) set({ sel:b.dataset.sel, photo:0 });
  else if (b.dataset.photo) set({ photo:parseInt(b.dataset.photo,10) });
});

render();
</script>
